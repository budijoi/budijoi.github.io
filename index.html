<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donasi</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
  }

  .modal {
    background: #fff;
    border-radius: 24px;
    width: 420px;
    max-width: 94vw;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    text-align: center;
    padding: 32px 24px 28px;
  }

  .modal-header h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .modal-header p {
    font-size: 14px;
    opacity: 0.85;
  }

  .modal-body {
    padding: 28px 24px 20px;
    text-align: center;
  }

  .qr-wrapper {
    background: #fff;
    border: 2px dashed #e5e7eb;
    border-radius: 16px;
    padding: 16px;
    display: inline-block;
    margin-bottom: 16px;
  }

  .qr-wrapper img {
    display: block;
    width: 200px;
    height: 200px;
    object-fit: contain;
  }

  .modal-body .label {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 4px;
  }

  .modal-body .bank {
    font-size: 16px;
    font-weight: 700;
    color: #111827;
  }

  .thanks {
    background: #f0fdf4;
    color: #16a34a;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 10px;
    margin: 16px 0 0;
    line-height: 1.5;
  }

  .ticker-wrap {
    background: #111827;
    padding: 10px 0;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }

  .ticker-wrap::before,
  .ticker-wrap::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40px;
    z-index: 2;
    pointer-events: none;
  }

  .ticker-wrap::before {
    left: 0;
    background: linear-gradient(to right, #111827, transparent);
  }

  .ticker-wrap::after {
    right: 0;
    background: linear-gradient(to left, #111827, transparent);
  }

  .ticker {
    display: inline-flex;
    gap: 48px;
    animation: scroll 30s linear infinite;
  }

  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #d1d5db;
    font-size: 13px;
  }

  .ticker-item .name {
    color: #fff;
    font-weight: 600;
  }

  .ticker-item .amount {
    color: #fbbf24;
    font-weight: 700;
  }

  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="modal">
  <div class="modal-header">
    <h1>💜 Sampaikan Donasi</h1>
    <p>Pilih metode di bawah ini</p>
  </div>
  <div class="modal-body">
    <div class="qr-wrapper">
      <img src="QRIS.png" alt="QRIS">
    </div>
    <div class="label">Scan QRIS</div>
    <div class="bank">Semua E-Wallet & Mobile Banking</div>
    <div class="thanks">
      Berapapun jumlahnya tentu akan sangat berarti, terima kasih.
    </div>
  </div>
  <div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
  </div>
</div>

<script>
  const donors = [
    { name: 'Ahmad Fauzi', amount: 'Rp5.000' },
    { name: 'Siti Nurhaliza', amount: 'Rp10.000' },
    { name: 'Budi Santoso', amount: 'Rp5.000' },
    { name: 'Dewi Lestari', amount: 'Rp5.000' },
    { name: 'Rudi Hartono', amount: 'Rp10.000' },
    { name: 'Ani Rahmawati', amount: 'Rp5.000' },
    { name: 'Dimas Prayoga', amount: 'Rp2.000' },
    { name: 'Rina Wijaya', amount: 'Rp5.000' },
    { name: 'Agus Prasetyo', amount: 'Rp6.000' },
    { name: 'Maya Anggraini', amount: 'Rp9.000' },
    { name: 'Hendra Gunawan', amount: 'Rp12.000' },
    { name: 'Fitri Handayani', amount: 'Rp5.000' },
  ];

  const ticker = document.getElementById('ticker');

  function renderItems(list) {
    return list.map(d => `
      <span class="ticker-item">
        <span class="name">${d.name}</span>
        <span class="amount">${d.amount}</span>
      </span>
    `).join('');
  }

  ticker.innerHTML = renderItems(donors) + renderItems(donors);
</script>
</body>
</html>
